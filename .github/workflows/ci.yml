name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile Python files
        run: python -m compileall -q main.py scripts src
      - name: Lint
        run: python -m ruff check main.py run_dashboard.py scripts src tests
      - name: Type check JD, cover-letter, and ML modules
        run: python -m mypy

  core-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run core tests with coverage
        run: >-
          python -m coverage run
          --source=src
          --omit='src/ml/*'
          scripts/run_test_group.py core
      - name: Enforce core coverage baseline
        run: python -m coverage report --fail-under=68
      - name: Enforce workflow coverage baselines
        run: |
          python -m coverage report --include='src/manual_jobs.py,src/job_document.py,src/manual_jd_parser.py' --fail-under=70
          python -m coverage report --include='src/dashboard_manual.py' --fail-under=45
          python -m coverage report --include='src/dashboard_fetch.py' --fail-under=70
          python -m coverage report --include='src/tracker.py,src/dashboard_tracker.py' --fail-under=80
      - name: Run scoring benchmark
        run: python scripts/evaluate_scoring.py
      - name: Run privacy audit
        run: python scripts/privacy_audit.py
      - name: Check dependency consistency
        run: python -m pip check

  ml-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-ml.txt -r requirements-dev.txt
      - name: Run ML tests with coverage
        run: >-
          python -m coverage run
          --source=src/ml
          -m pytest
          tests/test_ml_*.py
          -q
      - name: Enforce ML coverage baseline
        run: python -m coverage report --fail-under=80
      - name: Run anonymous semantic-evidence validation
        run: python scripts/ml/evaluate_real_validation.py --semantic-only
      - name: Validate public v21 release contract
        run: python scripts/ml/validate_minilm_v21_release.py
      - name: Check dependency consistency
        run: python -m pip check

  macos-install-smoke:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install base dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Verify supported launcher contract
        run: python -m pytest tests/test_dashboard_launcher.py tests/test_demo_package.py -q
      - name: Start supported dashboard entry point
        run: |
          PYTHONUNBUFFERED=1 python run_dashboard.py --server.headless=true --server.port=18501 > /tmp/job-copilot-streamlit.log 2>&1 &
          dashboard_pid=$!
          trap 'kill "$dashboard_pid" 2>/dev/null || true; wait "$dashboard_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if ! kill -0 "$dashboard_pid" 2>/dev/null; then
              cat /tmp/job-copilot-streamlit.log
              exit 1
            fi
            if curl --noproxy '*' --fail --silent http://127.0.0.1:18501/_stcore/health | grep -q '^ok$'; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/job-copilot-streamlit.log
          exit 1
      - name: Check dependency consistency
        run: python -m pip check
