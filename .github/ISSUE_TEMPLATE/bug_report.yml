name: Bug report
description: Report a reproducible Job Copilot problem using fictional data
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach resumes, API keys, tokens, private job records, or generated application materials.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: macOS, Python, and browser versions
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction with fictional data
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials and Personal data and used fictional examples.
          required: true
